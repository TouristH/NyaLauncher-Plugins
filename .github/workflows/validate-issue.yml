name: Initialize plugin request

on:
  issues:
    types: [opened, reopened]

permissions: {}

jobs:
  initialize:
    if: >-
      github.event_name == 'issues' &&
      (startsWith(github.event.issue.title, '[Plugin]') ||
       startsWith(github.event.issue.title, '[Yank]') ||
       startsWith(github.event.issue.title, '[Review]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted registry code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Initialize labels without downloading publisher assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/issue_submission.py initialize --event "$GITHUB_EVENT_PATH"
