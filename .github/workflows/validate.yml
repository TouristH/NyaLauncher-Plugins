name: Validate registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Validate sources and generated index
        run: python tools/validate.py --check --verify-assets
      - name: Enforce pull request scope and immutable releases
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
        run: python tools/check_pr.py --base "$BASE_SHA" --actor "$PR_ACTOR"
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
