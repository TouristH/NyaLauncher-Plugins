name: Approve yank or reject plugin issue

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize-yank:
    if: >-
      startsWith(github.event.issue.title, '[Yank]') &&
      github.event.comment.body == '/approve' &&
      contains(github.event.issue.labels.*.name, 'plugin-yank') &&
      contains(github.event.issue.labels.*.name, 'pending-review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted registry code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Fail closed until the identity migration is complete
        run: >-
          jq -e '.schemaVersion == 2' repository.json >/dev/null ||
          (echo '::notice::Registry v2 migration is pending; yank writes are disabled' && exit 78)
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Authorize trusted yank approver before entering the write queue
        run: >-
          python tools/issue_submission.py authorize
          --event "$GITHUB_EVENT_PATH"
          --command approve

  yank:
    needs: authorize-yank
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: registry-write
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted registry main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Reject a stale approval after a queued rejection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/issue_submission.py check-terminal
          --event "$GITHUB_EVENT_PATH"
          --operation approve
      - name: Revalidate and apply the yank request locally
        id: apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVER: ${{ github.event.comment.user.login }}
        run: >-
          python tools/issue_submission.py apply
          --event "$GITHUB_EVENT_PATH"
          --actor "$APPROVER"
          --summary approval-summary.md
          --github-output "$GITHUB_OUTPUT"
      - name: Rebuild generated views
        run: python tools/validate.py --write
      - name: Validate deterministic registry output
        run: python tools/validate.py --check
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Stage only yank data
        id: changes
        run: |
          git add -- plugins.json plugins reviews plugin_details.json \
            public/v1/index.json public/v2/index.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "The yank is already reflected in main"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
      - name: Mint a short-lived registry App token
        if: steps.changes.outputs.has_changes == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NYA_REGISTRY_APP_CLIENT_ID }}
          private-key: ${{ secrets.NYA_REGISTRY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Commit, open the App PR, and wait for protected auto-merge
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: registry-bot/yank/issue-${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          set -euo pipefail
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit \
            -m "chore: yank plugin release from issue #${{ github.event.issue.number }}"

          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          cleanup_writer_auth() {
            git config --local --unset-all http.https://github.com/.extraheader || true
          }
          trap cleanup_writer_auth EXIT
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH_HEADER"

          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [ -n "$REMOTE_SHA" ]; then
            git -c core.hooksPath=/dev/null push \
              --force-with-lease="refs/heads/${BRANCH}:${REMOTE_SHA}" \
              origin "HEAD:refs/heads/${BRANCH}"
          else
            git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/${BRANCH}"
          fi

          PR_DATA="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open -f base=main \
            -f "head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}" -f per_page=100 | \
            jq -c --arg repo "$GITHUB_REPOSITORY" --arg bot "${APP_SLUG}[bot]" \
              '[.[] | select(((.head.repo.full_name // "") | ascii_downcase) == ($repo | ascii_downcase) and ((.user.login // "") | ascii_downcase) == ($bot | ascii_downcase))] | if length == 0 then {} else {number: .[0].number, url: .[0].html_url} end')"
          PR_NUMBER="$(jq -r '.number // empty' <<<"$PR_DATA")"
          if [ -z "$PR_NUMBER" ]; then
            PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "chore: approve yank request #${{ github.event.issue.number }}" \
              --body "Applies the trusted maintainer yank request from ${ISSUE_URL}. Closes #${{ github.event.issue.number }}")"
            PR_NUMBER="$(gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
          fi

          PR_STATE="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          AUTO_MERGE="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$PR_STATE" = "OPEN" ] && [ "$AUTO_MERGE" != "true" ]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --auto --squash --delete-branch
          fi

          for _ in $(seq 1 180); do
            PR_DATA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json state,mergeStateStatus --jq '.state + " " + .mergeStateStatus')"
            case "$PR_DATA" in
              MERGED\ *)
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null 2>&1 || true
                exit 0
                ;;
              CLOSED\ *)
                echo "::error::Registry App PR #${PR_NUMBER} was closed without merging"
                exit 1
                ;;
              "OPEN BEHIND")
                gh api --method PUT \
                  "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/update-branch" >/dev/null
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for Registry App PR #${PR_NUMBER} to merge"
          exit 1
      - name: Mark the Issue approved only after main contains the yank
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/issue_submission.py complete
          --event "$GITHUB_EVENT_PATH"
          --summary approval-summary.md

  authorize-reject:
    if: >-
      (startsWith(github.event.issue.title, '[Plugin]') ||
       startsWith(github.event.issue.title, '[Yank]')) &&
      startsWith(github.event.comment.body, '/reject')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted registry code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Fail closed until the identity migration is complete
        run: >-
          jq -e '.schemaVersion == 2' repository.json >/dev/null ||
          (echo '::notice::Registry v2 migration is pending; issue rejection is disabled' && exit 78)
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Authorize trusted rejector without entering the write queue
        run: >-
          python tools/issue_submission.py authorize
          --event "$GITHUB_EVENT_PATH"
          --command reject

  reject:
    needs: authorize-reject
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: registry-write
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted registry code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Reject stale rejection after a queued approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/issue_submission.py check-terminal
          --event "$GITHUB_EVENT_PATH"
          --operation reject
      - name: Reject request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWER: ${{ github.event.comment.user.login }}
        run: python tools/issue_submission.py reject --event "$GITHUB_EVENT_PATH" --actor "$REVIEWER"
