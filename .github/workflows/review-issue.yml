name: Apply administrator plugin review

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    if: >-
      startsWith(github.event.issue.title, '[Review]') &&
      (startsWith(github.event.comment.body, '/verify ') ||
       startsWith(github.event.comment.body, '/revoke-review '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted registry code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Authorize the exact trusted review command
        run: python tools/review_bot.py authorize --event "$GITHUB_EVENT_PATH"

  review:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: registry-write
      queue: max
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted registry main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Revalidate the exact artifact and apply the review locally
        id: apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/review_bot.py apply
          --event "$GITHUB_EVENT_PATH"
          --summary review-summary.md
          --github-output "$GITHUB_OUTPUT"
      - name: Rebuild generated views
        run: python tools/validate.py --write
      - name: Validate deterministic registry output
        run: python tools/validate.py --check
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Stage only review data
        id: changes
        run: |
          git add -- reviews public/v1/index.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "The exact review state is already reflected in main"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
      - name: Mint a short-lived registry App token
        if: steps.changes.outputs.has_changes == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NYA_REGISTRY_APP_CLIENT_ID }}
          private-key: ${{ secrets.NYA_REGISTRY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Commit, open the App PR, and wait for protected auto-merge
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: registry-bot/review/issue-${{ github.event.issue.number }}
          REVIEW_ACTION: ${{ steps.apply.outputs.action }}
          PLUGIN_ID: ${{ steps.apply.outputs.plugin_id }}
          VERSION: ${{ steps.apply.outputs.version }}
          SHA256: ${{ steps.apply.outputs.sha256 }}
        run: |
          set -euo pipefail
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit \
            -m "chore: ${REVIEW_ACTION} ${PLUGIN_ID} ${VERSION}"

          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          cleanup_writer_auth() {
            git config --local --unset-all http.https://github.com/.extraheader || true
          }
          trap cleanup_writer_auth EXIT
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH_HEADER"

          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [ -n "$REMOTE_SHA" ]; then
            git -c core.hooksPath=/dev/null push \
              --force-with-lease="refs/heads/${BRANCH}:${REMOTE_SHA}" \
              origin "HEAD:refs/heads/${BRANCH}"
          else
            git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/${BRANCH}"
          fi

          printf 'Applies trusted administrator command `%s` to `%s@%s` at fixed SHA-256 `%s`.\n\nCloses #%s\n' \
            "$REVIEW_ACTION" "$PLUGIN_ID" "$VERSION" "$SHA256" \
            "${{ github.event.issue.number }}" > review-pr-body.md
          PR_DATA="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open -f base=main \
            -f "head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}" -f per_page=100 | \
            jq -c --arg repo "$GITHUB_REPOSITORY" --arg bot "${APP_SLUG}[bot]" \
              '[.[] | select(((.head.repo.full_name // "") | ascii_downcase) == ($repo | ascii_downcase) and ((.user.login // "") | ascii_downcase) == ($bot | ascii_downcase))] | if length == 0 then {} else {number: .[0].number, url: .[0].html_url} end')"
          PR_NUMBER="$(jq -r '.number // empty' <<<"$PR_DATA")"
          if [ -z "$PR_NUMBER" ]; then
            PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "chore: ${REVIEW_ACTION} ${PLUGIN_ID} ${VERSION}" \
              --body-file review-pr-body.md)"
            PR_NUMBER="$(gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
          else
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file review-pr-body.md
          fi

          PR_STATE="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          AUTO_MERGE="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$PR_STATE" = "OPEN" ] && [ "$AUTO_MERGE" != "true" ]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --auto --squash --delete-branch
          fi

          for _ in $(seq 1 180); do
            PR_DATA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json state,mergeStateStatus --jq '.state + " " + .mergeStateStatus')"
            case "$PR_DATA" in
              MERGED\ *)
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null 2>&1 || true
                exit 0
                ;;
              CLOSED\ *)
                echo "::error::Registry App PR #${PR_NUMBER} was closed without merging"
                exit 1
                ;;
              "OPEN BEHIND")
                gh api --method PUT \
                  "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/update-branch" >/dev/null
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for Registry App PR #${PR_NUMBER} to merge"
          exit 1
      - name: Publish the terminal review result only after main is updated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_ACTION: ${{ steps.apply.outputs.action }}
        run: |
          set -euo pipefail
          if [ "$REVIEW_ACTION" = "verify" ]; then
            TERMINAL_LABEL="verified"
            OPPOSITE_LABEL="review-revoked"
            gh label create verified --repo "$GITHUB_REPOSITORY" \
              --color 0e8a16 --description "Exact plugin artifact verified by an administrator" --force
          else
            TERMINAL_LABEL="review-revoked"
            OPPOSITE_LABEL="verified"
            gh label create review-revoked --repo "$GITHUB_REPOSITORY" \
              --color b60205 --description "Administrator verification was revoked" --force
          fi
          delete_label_unless_missing() {
            local label="$1"
            local delete_error
            delete_error="$(mktemp)"
            if ! gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/labels/${label}" \
              >/dev/null 2>"$delete_error"; then
              if ! grep -q "HTTP 404" "$delete_error"; then
                cat "$delete_error" >&2
                rm -f "$delete_error"
                return 1
              fi
            fi
            rm -f "$delete_error"
          }
          MARKER="<!-- nya-registry-review:${REVIEW_ACTION}:${{ github.event.comment.id }} -->"
          FOUND="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${MARKER}\"))) | .id" \
            | head -n 1)"
          if [ -z "$FOUND" ]; then
            printf '\n%s\n' "$MARKER" >> review-summary.md
            gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" \
              --body-file review-summary.md
          fi
          delete_label_unless_missing "$OPPOSITE_LABEL"
          gh issue edit "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" \
            --add-label "$TERMINAL_LABEL"
          delete_label_unless_missing review-request
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}" \
            -f state=closed >/dev/null
